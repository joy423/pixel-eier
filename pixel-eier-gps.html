<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel-Eier</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:'Press Start 2P',monospace;min-height:100vh;color:#fff;overflow-x:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit}
header{position:relative;text-align:center;padding:26px 12px 6px}
h1{font-size:clamp(20px,5vw,34px);text-shadow:4px 4px 0 #e01ee0;letter-spacing:2px}
#mute{position:absolute;right:12px;top:14px;background:#000;color:#fff;border:3px solid #fff;font-size:16px;width:46px;height:46px;cursor:pointer}

/* Laufen */
.walk{max-width:900px;margin:18px auto 0;padding:16px;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;gap:14px}
.road{position:relative;width:100%;height:110px;overflow:hidden;border-bottom:4px solid #fff;
  background:repeating-linear-gradient(90deg,#1a1a1a 0 24px,#000 24px 48px) bottom/100% 14px no-repeat}
.road.go{animation:road .5s linear infinite}
@keyframes road{to{background-position:-48px 100%}}
.tree{position:absolute;bottom:14px;width:24px;height:48px;background:linear-gradient(#3fbf3f 0 60%,#6b3f1d 60%);box-shadow:inset -6px 0 0 rgba(0,0,0,.3)}
.road.go .tree{animation:trees 4s linear infinite}
@keyframes trees{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
#walker{position:absolute;left:50%;bottom:14px;width:48px;height:72px;margin-left:-24px}
.kmbig{font-size:13px;text-align:center;line-height:1.8}
.kmbig b{font-size:20px;color:#ffd93b}
#startBtn{font-size:16px;padding:16px 28px;background:#3fbf3f;color:#fff;border:4px solid #fff;box-shadow:5px 5px 0 #333;cursor:pointer;text-shadow:2px 2px 0 #000}
#startBtn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 #333}
#gps{font-size:10px;color:#aaa;text-align:center;line-height:1.8;min-height:18px}
.hint{font-size:8px;color:#aaa;text-align:center;line-height:1.8}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:900px;margin:0 auto;padding:30px 16px 20px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);row-gap:30px}}
.slot{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;background:none;border:none;color:inherit}
.slot canvas{width:120px;height:160px;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.18))}
.slot:nth-child(2) canvas{animation-delay:-.7s}
.slot:nth-child(3) canvas{animation-delay:-1.4s}
.slot:nth-child(4) canvas{animation-delay:-2s}
.slot canvas.wob{animation:wobble .6s ease-in-out}
.slot canvas.new{animation:drop .7s cubic-bezier(.3,1.6,.6,1)}
.slot.ready canvas{animation:wobble 1s ease-in-out infinite;filter:drop-shadow(0 0 14px #ffd93b)}
.km{background:#000;color:#fff;padding:8px 12px;font-size:14px;border:3px solid #fff}
.bar{width:110px;height:12px;border:2px solid #fff;background:#000}
.bar i{display:block;height:100%;background:#ffd93b;width:0}
.prog{font-size:8px;color:#fff}
.slot.ready .prog{color:#ffd93b}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(5deg)}}
@keyframes drop{0%{transform:translateY(-100vh)}100%{transform:translateY(0)}}

.panel{max-width:900px;margin:10px auto 40px;padding:18px;border:4px solid #fff}
.panel h2{font-size:12px;margin-bottom:14px}
.stats{font-size:9px;color:#ccc;margin-bottom:16px;line-height:2}
.coll{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:8px;text-align:center;width:78px;line-height:1.5}
.item canvas{width:55px;height:55px}
.item.medal canvas{width:42px;height:60px}
.item.off canvas{filter:grayscale(1) brightness(.35)}
.item.off{color:#666}
#reset{margin-top:20px;font-size:8px;padding:8px 10px;background:#000;color:#888;border:2px solid #555;cursor:pointer}
#reset.sure{color:#fff;border-color:#e01ee0;background:#e01ee0}

/* Overlay */
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:#000;overflow:hidden}
#ov.show{display:flex}
#msg{font-size:clamp(14px,4vw,20px);min-height:28px;margin-bottom:26px;text-align:center;padding:0 12px;line-height:1.6}
#stage{position:relative;width:240px;height:320px;display:flex;align-items:flex-end;justify-content:center}
#bigEgg{width:192px;height:256px;transform-origin:50% 100%;filter:drop-shadow(0 0 16px rgba(255,255,255,.25))}
#bigEgg.drop{animation:drop .6s cubic-bezier(.3,1.6,.6,1)}
#bigEgg.wob{animation:wobble .7s ease-in-out}
#bigEgg.shake{animation:shake .08s linear infinite}
#glow{position:absolute;left:50%;top:55%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(#fff 0%,rgba(255,255,255,.7) 35%,rgba(255,255,255,0) 70%);opacity:0;transition:all 1.2s ease-in}
#glow.on{width:520px;height:520px;opacity:1}
@keyframes shake{0%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg)}100%{transform:translateX(-4px) rotate(-3deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity .5s}
#flash.on{opacity:1;transition:opacity .15s}
#reveal{display:none;flex-direction:column;align-items:center;position:relative;z-index:2}
#reveal.show{display:flex}
#rays{position:absolute;left:50%;top:110px;width:700px;height:700px;margin:-350px 0 0 -350px;z-index:-1;opacity:.28;
  background:repeating-conic-gradient(#ffe680 0 10deg,transparent 10deg 20deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);
  animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#medal{width:140px;height:200px;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
.mlabel{margin-top:14px;font-size:12px}
#badges{display:flex;gap:22px;margin-top:26px}
.b{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:9px;animation:pop .5s cubic-bezier(.3,1.7,.5,1) both}
.b canvas{width:88px;height:88px}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
#ok{margin-top:34px;font-size:13px;padding:14px 26px;background:#3fbf3f;color:#fff;border:4px solid #fff;box-shadow:5px 5px 0 #333;cursor:pointer;text-shadow:2px 2px 0 #000;animation:pop .4s both;animation-delay:1.4s}
.px{position:fixed;width:12px;height:12px;left:50%;top:50%;z-index:15;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;border:3px solid #fff;padding:10px 14px;font-size:9px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>PIXEL-EIER</h1>
  <button id="mute" aria-label="Ton an/aus">🔊</button>
</header>

<section class="walk">
  <div class="road" id="road">
    <div class="tree" style="left:12%"></div><div class="tree" style="left:38%;height:60px"></div>
    <div class="tree" style="left:71%"></div><div class="tree" style="left:93%;height:56px"></div>
    <div class="tree" style="left:130%"></div><div class="tree" style="left:165%;height:60px"></div>
    <canvas id="walker" width="8" height="12"></canvas>
  </div>
  <div class="kmbig">Gelaufen insgesamt<br><b id="kmTotal">0.00 km</b></div>
  <button id="startBtn">▶ START (GPS)</button>
  <div id="gps">GPS aus</div>
  <div class="hint">Lauf in echt – alle 4 Eier sammeln deine Meter.<br>Chrome offen und Bildschirm an lassen.<br>Auto, Bus und Velo zählen nicht.</div>
</section>

<div class="grid" id="grid"></div>

<div class="panel">
  <h2>Deine Sammlung</h2>
  <div class="stats" id="stats"></div>
  <div class="coll" id="coll"></div>
  <button id="reset">Alles zurücksetzen</button>
</div>

<div id="ov">
  <div id="msg"></div>
  <div id="stage"><div id="glow"></div><canvas id="bigEgg" width="12" height="16"></canvas></div>
  <div id="reveal">
    <div id="rays"></div>
    <canvas id="medal" width="14" height="20"></canvas>
    <div class="mlabel" id="mlabel"></div>
    <div id="badges"></div>
    <button id="ok">Super!</button>
  </div>
</div>
<div id="flash"></div>
<div id="toast"></div>

<script>
const C={green:'#3fbf3f',white:'#f2f2f2',black:'#2a2a2a',yellow:'#ffd93b',orange:'#ff8c1a',pink:'#ff9ecb',magenta:'#e01ee0'};
const COLS=Object.values(C);
const BADGES=[
  {name:'Stern', color:C.yellow, icon:['...X...','...X...','XXXXXXX','.XXXXX.','..XXX..','.XX.XX.','.X...X.']},
  {name:'Herz',  color:C.pink,   icon:['.XX.XX.','XXXXXXX','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...']},
  {name:'Blitz', color:C.orange, icon:['...XXX.','..XXX..','.XXX...','XXXXXX.','..XXX..','.XX....','X......']},
  {name:'Krone', color:C.magenta,icon:['X..X..X','XX.X.XX','XXXXXXX','XXXXXXX','XXXXXXX','.......','XXXXXXX']},
];

/* ---------- Speicher ---------- */
const KEY='pixel-eier-v2';
function randEgg(){const b=COLS[Math.random()*7|0];let s;do{s=COLS[Math.random()*7|0]}while(s===b);return {base:b,spot:s,km:Math.random()<.5?2:5,walked:0}}
function fresh(){return {eggs:[{base:C.green,spot:C.yellow,km:2,walked:0},{base:C.white,spot:C.pink,km:5,walked:0},
  {base:C.black,spot:C.magenta,km:5,walked:0},{base:C.orange,spot:C.white,km:2,walked:0}],
  gold:0,silver:0,badges:{},km:0,hatched:0,muted:false,t:0}}
function valid(d){return d&&Array.isArray(d.eggs)&&d.eggs.length===4}
let S=fresh();
try{const d=JSON.parse(localStorage.getItem(KEY));if(valid(d))S=d}catch(e){}

function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}});

/* ---------- Sounds (8-Bit, Web Audio) ---------- */
let AC=null;
function ac(){
  if(S.muted)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,dur,o={}){
  const a=ac();if(!a)return;
  const t=a.currentTime+(o.at||0),osc=a.createOscillator(),g=a.createGain();
  osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);
  if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(o.vol||.12,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(a.destination);osc.start(t);osc.stop(t+dur+.05);
}
function noise(dur,o={}){
  const a=ac();if(!a)return;
  const t=a.currentTime+(o.at||0),len=Math.max(1,a.sampleRate*dur|0);
  const buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.freq||1000;f.Q.value=o.q||1;
  const g=a.createGain();g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(a.destination);src.start(t);
}
const SFX={
  step(alt){noise(.07,{vol:.35,freq:alt?180:260,type:'lowpass',q:3});tone(alt?90:110,.05,{type:'triangle',vol:.12})},
  start(){tone(392,.08,{vol:.1});tone(523,.08,{at:.08,vol:.1});tone(784,.12,{at:.16,vol:.1})},
  stop(){tone(784,.08,{vol:.1});tone(523,.08,{at:.08,vol:.1});tone(392,.12,{at:.16,vol:.1})},
  wobble(){tone(330,.14,{slide:180,vol:.12});tone(200,.16,{at:.2,slide:360,vol:.1})},
  crack(){noise(.14,{vol:.45,freq:3200,type:'highpass',q:.7});tone(1400,.06,{slide:300,vol:.08});noise(.05,{at:.06,vol:.3,freq:2000})},
  shake(){for(let i=0;i<14;i++)tone(330+i*55,.07,{at:i*.08,vol:.07,type:'triangle'})},
  hatch(){noise(.8,{vol:.35,freq:1500,type:'highpass'});[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.18,{at:i*.045,vol:.09}))},
  fanfare(){
    const m=[[523,0,.11],[523,.12,.11],[523,.24,.11],[659,.36,.22],[523,.6,.11],[659,.72,.11],[784,.84,.5]];
    m.forEach(([f,at,d])=>{tone(f,d,{at,vol:.11});tone(f*2,d,{at,vol:.03,type:'triangle'})});
    [[131,0,.34],[165,.36,.22],[196,.6,.22],[262,.84,.5]].forEach(([f,at,d])=>tone(f,d,{at,vol:.14,type:'triangle'}));
  },
  badge(){tone(988,.08,{vol:.11});tone(1319,.35,{at:.08,vol:.11})},
  ready(){[784,988,1175,1568].forEach((f,i)=>tone(f,.22,{at:i*.08,type:'triangle',vol:.18}))},
  drop(){tone(1100,.4,{slide:180,type:'sine',vol:.12});noise(.18,{at:.42,vol:.4,freq:140,type:'lowpass'});tone(80,.15,{at:.42,type:'triangle',vol:.2})},
  nope(){tone(220,.1,{vol:.1});tone(165,.16,{at:.11,vol:.1})},
  click(){tone(880,.05,{vol:.07})},
};

/* ---------- Farben ---------- */
function hex(h){if(h.startsWith('rgb'))return h.match(/\d+/g).map(Number);h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(h,t,a){const x=hex(h),y=hex(t);return'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*a)).join(',')+')'}
const dark=(h,a)=>mix(h,'#000000',a),light=(h,a)=>mix(h,'#ffffff',a);
function lum(h){const[r,g,b]=hex(h);return(.299*r+.587*g+.114*b)/255}

/* ---------- Ei ---------- */
const MASK=['....XXXX....','...XXXXXX...','..XXXXXXXX..','..XXXXXXXX..','.XXXXXXXXXX.','.XXXXXXXXXX.','.XXXXXXXXXX.',
'XXXXXXXXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','.XXXXXXXXXX.','.XXXXXXXXXX.','..XXXXXXXX..','....XXXX....'];
const inM=(x,y)=>y>=0&&y<16&&x>=0&&x<12&&MASK[y][x]==='X';
const SPOTS=[[4,5],[5,5],[4,6],[8,3],[7,9],[8,9],[7,10],[8,10],[2,10],[3,11],[9,13],[5,13],[6,13],[6,2],[2,7]];
const CRACKS=[[],[[5,7],[6,8],[5,9]],[[7,7],[8,6],[4,10],[3,9]],[[9,7],[10,8],[2,8],[1,9],[6,10],[9,5]]];
function drawEgg(cv,egg,crack=0){
  const g=cv.getContext('2d');g.clearRect(0,0,12,16);
  const isBlack=lum(egg.base)<.25;
  const outline=isBlack?'#777':dark(egg.base,.6);
  const crackCol=isBlack?'#e8e8e8':'#1a1a1a';
  const cracks=[];for(let i=1;i<=crack;i++)cracks.push(...CRACKS[i]);
  for(let y=0;y<16;y++)for(let x=0;x<12;x++){
    if(!inM(x,y))continue;
    const edge=!inM(x-1,y)||!inM(x+1,y)||!inM(x,y-1)||!inM(x,y+1);
    let c;
    if(edge)c=outline;
    else{
      const spot=SPOTS.some(s=>s[0]===x&&s[1]===y);
      const shadow=(x-5.5)*.6+(y-8)*.45>2.6;
      c=spot?egg.spot:egg.base;
      if(shadow)c=dark(c,isBlack&&!spot?.35:.2);
      if(!spot&&((x===3&&(y===3||y===4))||(x===2&&y===5)||(x===4&&y===2)))c=light(egg.base,isBlack?.25:.55);
    }
    if(cracks.some(s=>s[0]===x&&s[1]===y))c=crackCol;
    g.fillStyle=c;g.fillRect(x,y,1,1);
  }
}
function drawBadge(cv,b){
  const g=cv.getContext('2d');g.clearRect(0,0,11,11);
  for(let y=0;y<11;y++)for(let x=0;x<11;x++){
    const d=Math.hypot(x-5,y-5),r=5.3;if(d>r)continue;
    let c=d>r-1.1?dark(b.color,.6):(d>r-2?dark(b.color,.2):b.color);
    if(d<=r-1.1&&x+y<6)c=light(b.color,.3);
    g.fillStyle=c;g.fillRect(x,y,1,1);
  }
  b.icon.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='X'){g.fillStyle=lum(b.color)>.6?dark(b.color,.6):'#fff';g.fillRect(x+2,y+2,1,1)}}));
}
const MSTAR=['..X..','.XXX.','XXXXX','.XXX.','.X.X.'];
function drawMedal(cv,gold){
  const g=cv.getContext('2d');g.clearRect(0,0,14,20);
  const P=gold?{b:'#f7c531',d:'#c28a0c',l:'#fff3a0',o:'#8a5d00'}:{b:'#d4d6e2',d:'#8f92a6',l:'#ffffff',o:'#5a5c6e'};
  ['RRBB....BBRR','RRBB....BBRR','.RRBB..BBRR.','.RRBB..BBRR.','..RRBBBBRR..','..RRBBBBRR..','...RRBBRR...','....RBBR....']
    .forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){g.fillStyle=ch==='R'?'#e0303a':'#2f6fe0';g.fillRect(x+1,y,1,1)}}));
  for(let y=7;y<20;y++)for(let x=0;x<14;x++){
    const d=Math.hypot(x-6.5,y-13),r=6.4;if(d>r)continue;
    let c=d>r-1?P.o:(d>r-2?P.d:P.b);
    if(d<=r-1&&d>r-2&&x+y<17)c=P.l;
    g.fillStyle=c;g.fillRect(x,y,1,1);
  }
  MSTAR.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='X'){g.fillStyle=P.d;g.fillRect(x+5,y+11,1,1)}}));
}
/* ---------- Läufer ---------- */
const WTOP=['..HHHH..','.HHHHHH.','.HSSSSH.','..SKSK..','..SSSS..','..TTTT..','.TTTTTT.','S.TTTT.S'];
const WLEG=[['..PPPP..','..P..P..','..P..P..','.BB..BB.'],['..PPPP..','...PP...','..P..P..','.BB...BB'],['..PPPP..','..P..P..','.P....P.','BB....BB']];
const WC={H:'#6b3f1d',S:'#f2c39b',K:'#000',T:'#e01ee0',P:'#3a5bd9',B:'#fff'};
function drawWalker(f){
  const g=document.getElementById('walker').getContext('2d');g.clearRect(0,0,8,12);
  [...WTOP,...WLEG[f]].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){g.fillStyle=WC[ch];g.fillRect(x,y,1,1)}}));
}

/* ---------- Anzeige ---------- */
function mk(t,c){const e=document.createElement(t);if(c)e.className=c;return e}
const fmt=n=>n.toFixed(2).replace('.',',');
function slotCanvas(i){return document.querySelectorAll('.slot canvas')[i]}
function renderGrid(dropIdx){
  const grid=document.getElementById('grid');grid.innerHTML='';
  S.eggs.forEach((egg,i)=>{
    const s=mk('button','slot');s.setAttribute('aria-label',egg.km+' km Ei');
    const cv=mk('canvas');cv.width=12;cv.height=16;drawEgg(cv,egg);
    if(i===dropIdx)cv.classList.add('new');
    cv.addEventListener('animationend',()=>cv.classList.remove('new','wob'));
    const k=mk('div','km');k.textContent=egg.km+' km';
    const bar=mk('div','bar');bar.append(mk('i'));
    const p=mk('div','prog');
    s.append(cv,k,bar,p);
    s.onclick=()=>tapEgg(i);
    grid.append(s);
  });
  updateProgress();
}
function updateProgress(){
  document.querySelectorAll('.slot').forEach((s,i)=>{
    const e=S.eggs[i];const done=e.walked>=e.km;
    s.querySelector('.bar i').style.width=Math.min(100,e.walked/e.km*100)+'%';
    s.querySelector('.prog').textContent=done?'BEREIT!':fmt(e.walked)+' / '+e.km+' km';
    s.classList.toggle('ready',done);
  });
  document.getElementById('kmTotal').textContent=fmt(S.km)+' km';
}
function renderColl(){
  const c=document.getElementById('coll');c.innerHTML='';
  [['gold','Gold'],['silver','Silber']].forEach(([k,n])=>{
    const it=mk('div','item medal'+(S[k]?'':' off'));
    const cv=mk('canvas');cv.width=14;cv.height=20;drawMedal(cv,k==='gold');
    const l=mk('div');l.textContent=n+'-Medaille ×'+S[k];it.append(cv,l);c.append(it);
  });
  BADGES.forEach(b=>{
    const n=S.badges[b.name]||0;
    const it=mk('div','item'+(n?'':' off'));
    const cv=mk('canvas');cv.width=11;cv.height=11;drawBadge(cv,b);
    const l=mk('div');l.textContent=n?b.name+' ×'+n:'???';it.append(cv,l);c.append(it);
  });
  const have=BADGES.filter(b=>S.badges[b.name]).length;
  document.getElementById('stats').innerHTML='Geschlüpfte Eier: '+S.hatched+'<br>Badges: '+have+' / 4';
}
function renderAll(){renderGrid();renderColl();setMuteIcon()}
let toastT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1800)}

/* ---------- Echtes Laufen mit GPS ---------- */
let walking=false,gpsOn=false,watchId=null,last=null,lastMove=0,stepT=0,frame=0,wakeLock=null,blip=0;
const road=document.getElementById('road'),startBtn=document.getElementById('startBtn'),gpsStat=document.getElementById('gps');
const GPSKEY=KEY+'-gps';
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function setStat(t,col){gpsStat.textContent=t;gpsStat.style.color=col||'#aaa'}
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gpsOn)keepAwake()});
function startGPS(fromTap){
  if(fromTap){ac();SFX.start()}
  if(!navigator.geolocation){setStat('Dieser Browser hat kein GPS.','#ff8c1a');return}
  if(gpsOn)return;
  setStat('Suche GPS …','#ffd93b');
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  gpsOn=true;startBtn.style.display='none';keepAwake();
  try{localStorage.setItem(GPSKEY,'1')}catch(e){}
}
function onErr(e){
  if(e.code===1){
    setStat('Standort ist blockiert. Erlaube den Standort für diese Seite in Chrome und tippe nochmal auf Start.','#ff8c1a');
    gpsOn=false;startBtn.style.display='';try{navigator.geolocation.clearWatch(watchId)}catch(_){}
    try{localStorage.removeItem(GPSKEY)}catch(_){}
  } else setStat('GPS-Signal schwach … geh nach draussen','#ff8c1a');
}
function onPos(p){
  const c=p.coords,pt={lat:c.latitude,lon:c.longitude,t:Date.now()};
  if(c.accuracy>40){setStat('GPS noch ungenau ('+Math.round(c.accuracy)+' m) … kurz warten','#ffd93b');return}
  if(!last){last=pt;setStat('GPS aktiv ✓  Lauf los!','#3fbf3f');return}
  const d=dist(last,pt),dt=Math.max(.5,(pt.t-last.t)/1000);
  if(d<Math.max(6,c.accuracy*.5))return;          // GPS-Zittern ignorieren
  last=pt;
  if(d/dt>4.2){setStat('Zu schnell! Fahren zählt nicht.','#ff8c1a');return} // über ca. 15 km/h
  setStat('GPS aktiv ✓  Du läufst!','#3fbf3f');
  lastMove=Date.now();
  addKm(d/1000);
}
function addKm(dk){
  const before=Math.floor(S.km*10);
  S.km+=dk;
  let ready=-1;
  S.eggs.forEach((e,i)=>{if(e.walked<e.km){e.walked=Math.min(e.km,e.walked+dk);if(e.walked>=e.km&&ready<0)ready=i}});
  if(Math.floor(S.km*10)>before)SFX.click(); // kleiner Ton alle 100 m
  updateProgress();save();
  if(ready>=0&&!hatching){SFX.ready();toast(S.eggs[ready].km+' km Ei ist bereit!');setTimeout(()=>hatch(ready),900)}
}
setInterval(()=>{
  const moving=Date.now()-lastMove<8000;
  if(moving!==walking){walking=moving;road.classList.toggle('go',moving);if(!moving)drawWalker(0)}
  if(moving){stepT+=.1;if(stepT>=.32){stepT=0;frame=frame===1?2:1;drawWalker(frame)}}
},100);
startBtn.onclick=()=>startGPS(true);
document.addEventListener('pointerdown',()=>ac(),{once:true});
try{if(localStorage.getItem(GPSKEY)==='1')startGPS(false)}catch(e){}

function tapEgg(i){
  const e=S.eggs[i];
  if(e.walked>=e.km){hatch(i);return}
  const cv=slotCanvas(i);cv.classList.remove('wob');void cv.offsetWidth;cv.classList.add('wob');
  SFX.nope();toast('Noch '+fmt(e.km-e.walked)+' km laufen!');
}

/* ---------- Schlüpfen ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let hatching=false,curIdx=-1;
async function hatch(i){
  if(hatching)return;hatching=true;curIdx=i;
  const egg=S.eggs[i];
  const ov=document.getElementById('ov'),big=document.getElementById('bigEgg'),msg=document.getElementById('msg'),
        glow=document.getElementById('glow'),stage=document.getElementById('stage'),rev=document.getElementById('reveal'),flash=document.getElementById('flash');
  rev.classList.remove('show');stage.style.display='flex';glow.classList.remove('on');msg.textContent='';
  drawEgg(big,egg,0);ov.classList.add('show');
  big.className='';void big.offsetWidth;big.className='drop';SFX.drop();
  await sleep(900);
  msg.textContent='Oh…?';
  for(let lv=1;lv<=3;lv++){
    big.className='';void big.offsetWidth;big.className='wob';SFX.wobble();
    await sleep(700);
    drawEgg(big,egg,lv);SFX.crack();
    await sleep(lv===3?300:650);
  }
  msg.textContent='Es schlüpft!';
  big.className='shake';glow.classList.add('on');SFX.shake();
  await sleep(1200);
  flash.classList.add('on');SFX.hatch();
  await sleep(250);
  big.className='';stage.style.display='none';glow.classList.remove('on');msg.textContent='';

  const gold=egg.km===5;
  const pool=[...BADGES].sort(()=>Math.random()-.5).slice(0,Math.random()<.5?1:2);
  gold?S.gold++:S.silver++;
  pool.forEach(b=>S.badges[b.name]=(S.badges[b.name]||0)+1);
  S.hatched++;
  // altes Ei raus, neues Ei rein – sofort gespeichert
  S.eggs[i]=randEgg();
  save();

  drawMedal(document.getElementById('medal'),gold);
  document.getElementById('mlabel').textContent=(gold?'Gold':'Silber')+'-Medaille!';
  const bd=document.getElementById('badges');bd.innerHTML='';
  pool.forEach((b,j)=>{
    const w=mk('div','b');w.style.animationDelay=(.6+j*.35)+'s';
    const cv=mk('canvas');cv.width=11;cv.height=11;drawBadge(cv,b);
    const l=mk('div');l.textContent=b.name+'-Badge';w.append(cv,l);bd.append(w);
    setTimeout(SFX.badge,(1100+j*350));
  });
  ['medal','ok'].forEach(id=>{const m=document.getElementById(id);m.style.animation='none';void m.offsetWidth;m.style.animation=''});
  rev.classList.add('show');
  burst([egg.base,egg.spot,'#ffd93b','#fff']);
  flash.classList.remove('on');
  SFX.fanfare();
  renderColl();
}
document.getElementById('ok').onclick=()=>{
  SFX.click();
  document.getElementById('ov').classList.remove('show');
  hatching=false;
  renderGrid(curIdx);
  setTimeout(SFX.drop,50);
  // weiteres fertiges Ei?
  const next=S.eggs.findIndex(e=>e.walked>=e.km);
  if(next>=0)setTimeout(()=>hatch(next),1200);
};
function burst(cols){
  for(let k=0;k<40;k++){
    const p=mk('div','px'),a=Math.random()*Math.PI*2,d=150+Math.random()*260;
    p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
    p.style.background=cols[k%cols.length];p.style.animationDelay=Math.random()*.15+'s';
    document.body.append(p);setTimeout(()=>p.remove(),1400);
  }
}

/* ---------- Ton & Reset ---------- */
function setMuteIcon(){document.getElementById('mute').textContent=S.muted?'🔇':'🔊'}
document.getElementById('mute').onclick=()=>{S.muted=!S.muted;setMuteIcon();save();SFX.click()};
const rb=document.getElementById('reset');let sureT;
rb.onclick=()=>{
  if(!rb.classList.contains('sure')){rb.classList.add('sure');rb.textContent='Wirklich? Nochmal tippen';clearTimeout(sureT);sureT=setTimeout(()=>{rb.classList.remove('sure');rb.textContent='Alles zurücksetzen'},3000);return}
  const m=S.muted;S=fresh();S.muted=m;save();rb.classList.remove('sure');rb.textContent='Alles zurücksetzen';renderAll();
};

drawWalker(0);renderAll();
</script>
